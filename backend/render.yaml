# Configuration only. Review/create manually; no service was created by this work.
services:
  - type: web
    name: specuse-api
    runtime: go
    plan: free
    rootDir: backend
    buildCommand: go build -tags netgo -ldflags '-s -w' -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: CATALOG_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: CORS_ALLOWED_ORIGINS
        sync: false
