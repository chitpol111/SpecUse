name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
        env:
          REACT_APP_API_BASE_URL: https://example.test/api/v1
      - name: Verify configured API URL in bundle
        run: grep -lF 'https://example.test/api/v1' build/assets/*.js

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.mod
      - name: Run tests
        run: go test ./...
      - name: Vet backend
        run: go vet ./...
      - name: Race checks
        run: go test -race ./internal/...
      - name: PostgreSQL migrations and permissions
        run: bash integration/postgres.sh
      - name: Private draft E2E fixture checks
        run: bash integration/private_draft_e2e_seed.sh
